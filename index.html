<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Graph</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="libs/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Unified Top Bar -->
  <header class="app-header">
    <div class="header-left">
      <button class="btn-nav-back" id="btn-back" title="Go up to parent node" style="display: none;">←</button>
      <div class="logo-clean" id="logo" title="Return to root node">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Knowledge Graph</span>
      </div>
      <div class="breadcrumbs" id="breadcrumbs"></div>
    </div>

    <!-- Global Deep Search Bar -->
    <div class="header-center">
      <div class="search-container" id="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="search-input" placeholder="Search stations, notes, files... (/)" autocomplete="off" spellcheck="false">
        <kbd class="search-shortcut-hint" id="search-shortcut-hint">/</kbd>
        <button type="button" class="btn-search-clear" id="btn-search-clear" style="display: none;" title="Clear search">&times;</button>
        <div class="search-dropdown" id="search-dropdown" style="display: none;">
          <div class="search-results-list" id="search-results-list"></div>
        </div>
      </div>
    </div>

    <div class="header-right">
      <!-- Full Graph Overview Toggle -->
      <button class="btn-header-view-toggle" id="btn-toggle-view" title="Toggle Full Graph Overview Mode">
        <span class="view-toggle-icon">🌐</span>
        <span class="view-toggle-label">Full Graph</span>
      </button>

      <!-- Next Learning Node Recommendation Pill -->
      <button class="next-node-pill" id="next-node-pill" style="display: none;" title="Next station to learn">
        <span class="next-node-icon">🎯</span>
        <span class="next-node-label" id="next-node-label">Next:</span>
        <span class="next-node-title" id="next-node-title">Station</span>
      </button>

      <!-- Overall Progress -->
      <div class="progress-pill" id="overall-progress-pill" title="Overall Graph Completion">
        <div class="progress-pill-bar"><div class="progress-pill-fill" id="overall-progress-fill"></div></div>
        <span class="progress-pill-text" id="overall-progress-text">0%</span>
      </div>
    </div>
  </header>

  <!-- Focused Graph Stage -->
  <main class="graph-main">
    <!-- Next Learning Node Recommendation Banner -->
    <div class="next-node-banner" id="next-node-banner" style="display: none;">
      <div class="next-banner-content">
        <span class="next-banner-icon" id="next-banner-icon">🎯</span>
        <div class="next-banner-text">
          <div class="next-banner-kicker" id="next-banner-kicker">RECOMMENDED NEXT STATION</div>
          <div class="next-banner-heading">
            <span class="next-banner-title" id="next-banner-title">Station</span>
            <span class="next-banner-category" id="next-banner-category"></span>
          </div>
        </div>
      </div>
      <button class="btn-next-banner-jump" id="btn-next-banner-jump">
        <span>Go to Station</span> →
      </button>
    </div>

    <div class="graph-stage" id="graph-stage">
      <svg class="graph-svg" id="graph-svg"></svg>
      <div class="graph-content-layer" id="graph-content-layer">
        <!-- Active Parent Node Center -->
        <div class="graph-parent-anchor" id="graph-parent-anchor"></div>

        <!-- Immediate Child Nodes Cluster with + Button as a child -->
        <div class="graph-children-anchor" id="graph-children-anchor"></div>
      </div>
    </div>

    <!-- Full Graph Overview Stage -->
    <div class="full-graph-stage" id="full-graph-stage" style="display: none;">
      <div class="full-graph-toolbar">
        <div class="full-graph-legend">
          <span class="legend-item"><span class="legend-dot status-completed"></span> Completed</span>
          <span class="legend-item"><span class="legend-dot status-in-progress"></span> In Progress</span>
          <span class="legend-item"><span class="legend-dot status-todo"></span> To Do</span>
          <span class="legend-item"><span class="legend-symbol">⑂</span> Branch Hub</span>
        </div>
        <div class="full-graph-controls">
          <button type="button" class="btn-fg-tool" id="btn-fg-zoom-in" title="Zoom In">+</button>
          <button type="button" class="btn-fg-tool" id="btn-fg-zoom-out" title="Zoom Out">−</button>
          <button type="button" class="btn-fg-tool" id="btn-fg-reset" title="Fit to Screen">Fit</button>
          <button type="button" class="btn-fg-tool btn-fg-close" id="btn-fg-close" title="Return to Focused View">✕ Close</button>
        </div>
      </div>

      <div class="full-graph-viewport" id="full-graph-viewport">
        <svg class="full-graph-svg" id="full-graph-svg">
          <g id="full-graph-canvas">
            <g id="full-graph-edges"></g>
            <g id="full-graph-nodes"></g>
          </g>
        </svg>
      </div>
      <div class="full-graph-footer-hint">Drag to pan · Scroll to zoom · Click any station to focus</div>
    </div>
  </main>

  <!-- Modal: Markdown Viewer & Editor (for both info.md and notes.md) -->
  <div class="summary-modal-overlay" id="markdown-modal-overlay">
    <div class="summary-modal" id="markdown-modal">
      <div class="summary-modal-header">
        <div class="summary-header-left">
          <span class="summary-modal-icon" id="md-modal-icon">ℹ️</span>
          <div>
            <h2 class="summary-modal-title" id="md-modal-title">info.md</h2>
            <span class="summary-modal-path" id="md-modal-path">graph/...</span>
          </div>
        </div>

        <div class="summary-header-controls">
          <!-- Toggle Document: Info vs Notes -->
          <div class="doc-switch-tabs">
            <button class="btn-doc-tab active" id="btn-doc-info" title="View & edit info.md">ℹ️ Info</button>
            <button class="btn-doc-tab" id="btn-doc-notes" title="View & edit notes.md">📝 Notes</button>
          </div>

          <!-- Mode Tabs: Rendered vs Edit -->
          <div class="summary-mode-tabs">
            <button class="btn-tab active" id="btn-tab-preview">👁️ Rendered</button>
            <button class="btn-tab" id="btn-tab-edit">✏️ Edit</button>
          </div>

          <button class="btn-save-disk" id="btn-save-markdown">💾 Save to Disk</button>
          <button class="summary-modal-close" id="btn-close-markdown" title="Close window">&times;</button>
        </div>
      </div>

      <div class="summary-modal-body">
        <!-- Rendered Markdown View (Marked.js + KaTeX) -->
        <div class="markdown-preview markdown-body" id="md-rendered-view"></div>

        <!-- Markdown Source Code Editor -->
        <div class="markdown-editor-pane" id="md-editor-view" style="display: none;">
          <div class="editor-toolbar">
            <button type="button" class="btn-tool" data-tool="bold" title="Bold">**B**</button>
            <button type="button" class="btn-tool" data-tool="code" title="Code Block">`Code`</button>
            <button type="button" class="btn-tool" data-tool="math" title="Math Formula">$Math$</button>
            <button type="button" class="btn-tool" data-tool="list" title="Bullet List">• List</button>
            <button type="button" class="btn-tool" data-tool="check" title="Task List">☑ Task</button>
            <span class="editor-shortcut-hint">Ctrl+S to save</span>
          </div>
          <textarea class="summary-editor-textarea" id="md-textarea" spellcheck="false" placeholder="Write markdown content..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Extra Files (Appears only if files exist or to upload) -->
  <div class="modal-overlay" id="extra-files-modal-overlay">
    <div class="modal-card modal-card-compact">
      <div class="modal-header">
        <div class="modal-title-group">
          <span class="modal-kicker">Folder Files</span>
          <h2 class="modal-title" id="extra-files-title">📁 Extra Files</h2>
          <span class="modal-parent-context" id="extra-files-path">graph/...</span>
        </div>
        <button class="modal-close" id="btn-close-extra-files">&times;</button>
      </div>

      <div class="modal-form">
        <div class="extra-files-list" id="extra-files-list"></div>

        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);">
          <button type="button" class="btn-upload-file-resource" id="btn-upload-extra-file-card">
            <span>➕</span> Upload File (Disk)
          </button>
        </div>

        <div class="modal-footer" style="margin-top: 12px; padding-top: 12px;">
          <span class="modal-status" id="extra-files-status"></span>
          <button type="button" class="btn-secondary" id="btn-done-extra-files">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Add Child Node (Choose Name Only) -->
  <div class="modal-overlay" id="add-child-modal-overlay">
    <div class="modal-card modal-card-compact">
      <div class="modal-header">
        <div class="modal-title-group">
          <h2 class="modal-title">➕ Add Child Node</h2>
          <span class="modal-parent-context" id="add-child-parent-label"></span>
        </div>
        <button class="modal-close" id="btn-close-add-child">&times;</button>
      </div>

      <form id="form-add-child" class="modal-form">
        <div class="form-group">
          <label class="form-label" for="new-child-name">Node Name <span class="required">*</span></label>
          <input type="text" id="new-child-name" class="form-input" placeholder="Enter node name..." required autofocus autocomplete="off">
        </div>

        <div class="modal-footer">
          <span class="modal-status" id="add-child-status"></span>
          <div class="modal-footer-actions">
            <button type="button" class="btn-secondary" id="btn-cancel-add-child">Cancel</button>
            <button type="submit" class="btn-primary" id="btn-submit-add-child">Create</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Hidden File Input for Extra File Uploads -->
  <input type="file" id="extra-file-input" style="display: none;" multiple>

  <!-- Local / Vendored Libraries with CDN Fallbacks -->
  <script src="libs/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="libs/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="libs/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- App Core Engine -->
  <script src="app.js"></script>
</body>
</html>
